description: Presentation-only HMI indication requests.
types:
  Indication:
    description: >-
      A display-only HMI event. It neither authorizes a token nor controls charging. AuthRequired sets a persistent
      display state and is expected only while an EV is physically plugged in. It does not change Auth-module state,
      including AuthPending. When enrollment is inactive, AuthAccepted and AuthRejected clear the persistent
      AuthRequired display state and show their transient result. During enrollment, either result ends enrollment
      and shows the corresponding enrollment result while preserving the persistent AuthRequired display state.
    type: string
    enum:
      - TagEnrollmentActive
      - TagEnrollmentInactive
      - AuthRequired
      - AuthAccepted
      - AuthRejected
  Request:
    description: A presentation request delivered to connected consumers.
    type: object
    additionalProperties: false
    properties:
      indication:
        description: The indication to display.
        $ref: /hmi_indication_request#/Indication
    required:
      - indication
