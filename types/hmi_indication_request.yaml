description: Presentation-only HMI indication requests.
types:
  Indication:
    description: >-
      A display-only HMI event. It neither authorizes a token nor controls charging. AuthRequired sets a persistent
      display state; AuthAccepted clears it; AuthRejected is transient and preserves the current display state.
    type: string
    enum:
      - TagEnrollmentActive
      - TagEnrollmentInactive
      - AuthRequired
      - AuthAccepted
      - AuthRejected
  Request:
    description: A presentation request delivered to connected consumers.
    type: object
    additionalProperties: false
    properties:
      indication:
        description: The indication to display.
        $ref: /hmi_indication_request#/Indication
    required:
      - indication
